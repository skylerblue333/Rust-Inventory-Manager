[package]
name = "app"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "app"
path = "src/main.rs"

[lib]
name = "app"
path = "src/lib.rs"

[dependencies]
actix-web = { version = "4.15", default-features = false, features = ["macros"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
